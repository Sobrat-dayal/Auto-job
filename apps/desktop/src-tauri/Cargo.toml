[package]
name = "autonom-desktop"
version = "0.1.0"
description = "AUTONOM Desktop Application Native Shell"
authors = ["AUTONOM Systems Team"]
edition = "2021"

[lib]
name = "autonom_desktop_lib"
crate-type = ["rlib"]
test = false

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
